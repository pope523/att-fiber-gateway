[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bgw320-engine-catalog"
version = "1.0.0"
description = "Cable Modem Monitor Catalog — modem config files and parser overrides"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bgw320-engine-core==1.0.0",
]
license = "MIT"
authors = [
    { name = "Solent Labs™" },
]
keywords = ["docsis", "cable-modem", "monitoring", "home-assistant", "modem-catalog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/pope523/att-fiber-gateway"
Repository = "https://github.com/pope523/att-fiber-gateway"
Documentation = "https://github.com/pope523/att-fiber-gateway#readme"
Issues = "https://github.com/pope523/att-fiber-gateway/issues"
Changelog = "https://github.com/pope523/att-fiber-gateway/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "bgw320-engine-core[sjcl]",
]

[tool.hatch.build.targets.wheel]
packages = ["solentlabs"]
exclude = ["**/test_data/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
